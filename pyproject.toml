[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bycall"
version = "0.2.0"
description = "Bycall — 企业级数字员工 Agent（路线 B：分层混搭自研）"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Bycall Team" }]
keywords = ["agent", "rag", "digital-employee", "langgraph", "zvec"]

# 运行时依赖（M0 最小集）。各里程碑新增依赖时在此追加。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "zvec>=0.5.1",
    "numpy>=1.26",
    "openai>=1.30",
    "httpx>=0.27",
    # M1 治理脊柱 + 控制面
    "sqlmodel>=0.0.22",  # ORM（User/Role/Prompt/AuditLog）
    "jinja2>=3.1",  # Admin Web UI 服务端渲染
    "python-multipart>=0.0.9",  # form 解析
    "pyyaml>=6.0",  # SKILL.md frontmatter 解析（导入导出）
    "itsdangerous>=2.2",  # session cookie 签名
    "passlib[bcrypt]>=1.7",  # admin 密码哈希
    "cryptography>=42.0",  # DB 中模型/IM 密钥的 Fernet 加密
    # M1.5 IM 接入（企微智能机器人长连接）
    "wecom-aibot-python-sdk>=1.0.2",
    # 限流（登录/聊天防暴力破解 + 费用 DoS）
    "redis>=5.0",
    # M3 工具治理：LangGraph 编排（StateGraph + ToolNode）+ OpenAI 兼容对话模型
    # 渐进式引入：只用编排+工具能力，Checkpointer/PostgresSaver 留后续（见 ADR-0002）
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    # M2 知识库：文档解析 + 父子块 + rerank
    "pymupdf>=1.28",  # PDF 解析（WeKnora 也用 MuPDF 内核）
    "python-docx>=1.2",  # Word (.docx) 解析
    "beautifulsoup4>=4.12",  # HTML 解析
    "lxml>=5.0",  # HTML/XML 快速解析
    "markdown>=3.7",  # Markdown → 结构化文本
    # M4 MCP 工具网关：官方 MCP Python SDK（ClientSession，stdio + streamable_http 传输）
    "mcp>=1.2",
    # M5 可观测性：OpenTelemetry 全链路 trace（默认关闭，enabled=False 时 no-op）。
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-otlp>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "prometheus-client>=0.20",  # M5 metrics：RED 指标 + Prometheus /metrics 端点
]

[project.optional-dependencies]
parse = [
    # 可切换解析引擎之 MarkItDown（builtin 不依赖它，按需安装）。
    "markitdown>=0.0.1a2",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "httpx>=0.27",  # 测试 FastAPI 用
]

[project.urls]
Documentation = "https://github.com/lilinsen/bycall/blob/main/README.md"

# hatchling: 把 src/bycall 作为包根
[tool.hatch.build.targets.wheel]
packages = ["src/bycall"]

# ---------- ruff ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff-specific
]
ignore = [
    "E501",  # 行长由 formatter 管
    "RUF001", "RUF002", "RUF003",  # 中文文档/注释里的全角标点（项目本身用中文）
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # 测试里允许 assert

[tool.ruff.format]
quote-style = "double"

# ---------- pytest ----------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: 需要外部服务（postgres/redis/真实 LLM key）的集成测试",
]
