<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bycall 数字员工治理控制台 —— 人格、能力、知识、权限、审计，策略活在代码层。" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Bycall 控制台</title>
    <script>
      // 首帧前写入主题属性，避免主题闪烁（FOUC）；与 useTheme.js 保持一致
      // 仅保留 mono，evergreen 已下线
      ;(function () {
        var mode = localStorage.getItem('bycall.mode') || 'light'
        if (mode === 'auto') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = 'mono'
        document.documentElement.dataset.mode = mode
        // 联动 EP 暗色基座（html.dark 作用域）
        document.documentElement.classList.toggle('dark', mode === 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
